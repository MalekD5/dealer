name: Platform tests

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-platform-tests
  cancel-in-progress: false

jobs:
  platform-tests:
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # The end-to-end install scenario runs an installed package's
      # executable, which needs a node on PATH.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run full Rust test suite
        run: cargo test --locked --all-targets
